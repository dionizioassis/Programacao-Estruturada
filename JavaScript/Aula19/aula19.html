/*
Receba uma palavra e conte quantas vogais ela possui.
• Leia o texto utilizando prompt().
• Percorra todos os caracteres da palavra.
• Considere as vogais a, e, i, o e u, independentemente de maiúsculas e minúsculas.
• Ao final, mostre a quantidade encontrada.
*/
let contador = 0
for(let i = 0; i<linguagem.length; i++){
    if (linguagem[i] == 'a' || linguagem[i] == 'e' || linguagem[i] == 'i' || linguagem[i] == 'o'|| linguagem[i] == 'u'){
        contador++
    }
}
console.log(`A palavra ${linguagem} possui ${contador} vogais`)
