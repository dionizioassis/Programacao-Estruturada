<script>
    let nome = ' Dionizio'
    // definir padrões
    let nomePadrao = nome.toUpperCase()
    nomePadrao = nomePadrao.trim()
    console.log(nomePadrao)

    nomePadrao = nomePadrao.toLocaleLowerCase()
    console.log(nomePadrao)

    // Verificando a presença de trechos

    let arquivo = "arquivo.pdf"
    let email = "dionizio123@gmail.com"

    console.log(arquivo.endsWith('pdf'))
    let divisor = email.indexOf('@')
    console.log(email.indexOf('@'))

    let user = email.slice(0,divisor)
    let provedorEmail = email.slice(divisor+1,email.length)

    console.log(user)
    console.log(provedorEmail)


    /*
    Considere um código acadêmico no formato CURSO-ANO-NÚMERO, por exemplo: CC-2026-0147.
    */
   //             0123456789
    let codigo = "CC-2026-0147"
    //• Localize a posição do primeiro e do segundo hífen.
    let hifens = []

    for(let i = 0; i < codigo.length; i++){
        if(codigo[i] === '-'){
            hifens.push(i)
        }
    }
    console.log(hifens)

    //• Extraia separadamente o curso, o ano e o número.
    let curso = codigo.slice(0,hifens[0])

    //• Converta o curso para letras minúsculas.
    curso = curso.toLocaleLowerCase()

    //• Utilize apenas os dois últimos caracteres do ano.
    let ano = codigo.slice(hifens[0]+3,hifens[1])
    let codigoFinal = codigo.slice(hifens[1],codigo.length)
    console.log(curso)
    console.log(ano)
    console.log(codigoFinal)
    // • Monte o resultado no formato curso/ano-numero. Para o exemplo, o resultado deve ser cc/26-0147.
    let novoCodigo = `${curso}/${ano}${codigoFinal}`
    console.log(novoCodigo)
   



</script>
