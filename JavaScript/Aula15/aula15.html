<!-- JS interno -->

<script>
    // Operadores Aritiméticos
    let x = 10
    let y = 5

    // Adição
    console.log(`Soma ${x} + ${y} = ${x + y}`)
    // Subtração
    console.log(`Subtração ${x} - ${y} = ${x - y}`)
    // Multiplicação
    console.log(`Multiplicação ${x} * ${y} = ${x * y}`)
    // Divisão
    console.log(`Divisão ${x} / ${y} = ${x / y}`)
    // Resto da divisão
    console.log(`Divisão ${x} % ${y} = ${x % y}`)

    // Operadores com atribuição,
    var contador = 0

    contador++
    console.log(`Contador = ${contador}`)

    contador--
    console.log(`Contador = ${contador}`)

    contador += 3
    console.log(`Contador = ${contador}`)

    contador -= 2
    console.log(`Contador = ${contador}`)

    //contador operacao= valor

    // Operadores Relacionais - true ou false
    
    // == igualdade
    console.log(`${x} == ${y} ? ${x == y}`)
    // != desigualdade
    console.log(`${x} != ${y} ? ${x != y}`)
    // > maior que
    console.log(`${x} > ${y} ? ${x > y}`)
    // < menor que
    console.log(`${x} < ${y} ? ${x < y}`)
    // >= maior ou igual
    console.log(`${x} >= ${y} ? ${x >= y}`)
    // <= menor ou igual
    console.log(`${x} <= ${y} ? ${x <= y}`)
    // === idêntico - tipo!
    let numero1 = 3
    let numero2 = "3"
    console.log(`${numero1} === ${numero2} ? ${numero1 === numero2}`)

    // Operadores lógicos
    let n1 = 2, n2 = 3
    // E - and - &&
    console.log(`${n1} == 2 and ${n2} == 3 ? ${(n1 ==2) && (n2 == 3)}`)

    // OU - or - ||
    console.log(`${n1} == 2 or ${n2} == 4 ? ${(n1 == 2) || (n2 == 4)}`)

    // NÃO - not
    console.log(`${n1} not == 2 ? ${!(n1 == 2)}`)


    // Entrada e saída de dados no JavaScript
    // Entrada de dados

    // 1 - Console do navegador
    // promtp() - Recebe uma string
    // confirm() - Bool (true) ou (false)

    let nome = prompt("Digite seu nome")
    let idade = prompt("Digite sua idade")
    let continua = confirm("Deseja continuar?")

    // converter string em número
    console.log(typeof Number(idade))


    // 2 - elementos do DOM (Document object model) 

    // Saída de dados
    // 1 - Console do navegador
    // alert("Mensagem") - Aparece para o usuário
    alert(`Olá ${nome} você tem ${idade} anos de idade!`)
    // console.log("") - Aparece no console do navegador
    console.log(`Olá ${nome} você tem ${idade} anos de idade!`)
    console.log(`Quer continuar? ${continua}`)
    // document.write("mensagem") - Escreve na tela do navegador
    document.write(`Olá ${nome} você tem ${idade} anos de idade!`)

</script>
